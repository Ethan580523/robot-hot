<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT HOT — 机器人产业动态聚合</title>
    <meta name="description" content="机器人产业动态聚合平台，聚焦人形机器人、工业机器人、具身智能、服务机器人等领域">
    <style>
        :root {
            --bg-primary: #0a0a0f; --bg-card: #1a1a24; --bg-card-hover: #22222e;
            --border: #2a2a38; --text-primary: #e8e8f0; --text-secondary: #9090a8; --text-muted: #606078;
            --accent: #00d4aa; --accent-dim: #00d4aa22;
            --radius: 12px; --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --max-width: 960px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); line-height: 1.7; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .nav-container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .nav-menu { display: flex; align-items: center; gap: 4px; list-style: none; }
        .nav-menu a { padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; }
        .nav-menu a:hover { color: var(--text-primary); background: var(--bg-card); }
        .nav-menu a.active { color: var(--accent); background: var(--accent-dim); }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 24px 20px 60px; }
        .hero { text-align: center; padding: 40px 20px 32px; }
        .hero h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; background: linear-gradient(135deg, var(--accent) 0%, #4ade80 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero p { font-size: 15px; color: var(--text-secondary); }
        .stats-bar { display: flex; justify-content: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 20px; font-weight: 700; color: var(--accent); }
        .stat-item .label { font-size: 12px; color: var(--text-muted); }
        .domain-bar { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .domain-tag { padding: 4px 12px; border-radius: 16px; font-size: 12px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
        .domain-tag:hover { border-color: var(--accent); color: var(--accent); }
        .domain-tag.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .quick-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 28px 0; }
        .quick-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all 0.2s; cursor: pointer; }
        .quick-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .quick-card .emoji { font-size: 28px; margin-bottom: 6px; }
        .quick-card h3 { font-size: 15px; margin-bottom: 2px; }
        .quick-card p { font-size: 12px; color: var(--text-muted); }
        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .section-title a { font-size: 13px; color: var(--accent); font-weight: 400; }
        .feed-list { display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all 0.2s; cursor: pointer; }
        .card:hover { background: var(--bg-card-hover); border-color: rgba(0,212,170,0.3); transform: translateY(-1px); }
        .card-tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        .tag-domain { background: #1a2a3e; color: #60a5fa; }
        .tag-type { background: var(--bg-primary); color: var(--text-muted); }
        .card-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 4px; }
        .card-title-en { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 400; }
        .card-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
        .footer { border-top: 1px solid var(--border); padding: 24px 20px; text-align: center; font-size: 13px; color: var(--text-muted); }
        .mobile-tabs { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); z-index: 100; padding: 8px 0; }
        .mobile-tabs-inner { display: flex; justify-content: space-around; }
        .mobile-tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 16px; font-size: 11px; color: var(--text-muted); }
        .mobile-tabs a.active { color: var(--accent); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .refresh-btn { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .refresh-btn:hover { background: var(--accent); color: var(--bg-primary); }
        @media (max-width: 768px) { .nav-menu { display: none; } .mobile-tabs { display: block; } .container { padding-bottom: 80px; } .hero h1 { font-size: 22px; } }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><span>🤖</span><span>ROBOT HOT</span></a>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">精选</a></li>
            <li><a href="all.html">全部动态</a></li>
            <li><a href="daily.html">日报</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="hero">
        <h1>🤖 机器人产业动态聚合</h1>
        <p>聚焦人形机器人 · 工业机器人 · 具身智能 · 服务机器人等领域</p>
        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><div class="num" id="statTotal">-</div><div class="label">总动态</div></div>
            <div class="stat-item"><div class="num" id="statToday">-</div><div class="label">今日更新</div></div>
            <div class="stat-item"><div class="num" id="statDomains">-</div><div class="label">领域覆盖</div></div>
        </div>
        <div class="domain-bar" id="domainBar"></div>
    </div>

    <div class="quick-nav">
        <a href="all.html" class="quick-card">
            <div class="emoji">📋</div>
            <h3>全部动态</h3>
            <p>按领域筛选浏览</p>
        </a>
        <a href="daily.html" class="quick-card">
            <div class="emoji">📰</div>
            <h3>行业日报</h3>
            <p>每日精选按领域归类</p>
        </a>
        <a href="about.html" class="quick-card">
            <div class="emoji">ℹ️</div>
            <h3>关于平台</h3>
            <p>数据源与技术栈</p>
        </a>
    </div>

    <div class="section-title">
        <span>🔥 最新动态</span>
        <div>
            <button class="refresh-btn" onclick="refresh()">🔄 刷新</button>
            <a href="all.html" style="margin-left:8px;">全部 →</a>
        </div>
    </div>

    <div class="feed-list" id="feedList"><div class="loading">加载中...</div></div>
</div>

<footer class="footer"><p>ROBOT HOT · 机器人产业动态聚合 · 数据来源见<a href="about.html">关于</a></p></footer>

<nav class="mobile-tabs">
    <div class="mobile-tabs-inner">
        <a href="index.html" class="active"><span>⭐</span>精选</a>
        <a href="all.html"><span>📋</span>全部</a>
        <a href="daily.html"><span>📰</span>日报</a>
        <a href="about.html"><span>ℹ️</span>更多</a>
    </div>
</nav>

<script>
const DOMAIN_CN = {
    humanoid:   { label: '人形机器人', emoji: '🤖' },
    industrial: { label: '工业机器人', emoji: '🏭' },
    embodied:   { label: '具身智能', emoji: '🧠' },
    service:    { label: '服务机器人', emoji: '🛎️' },
    drone:      { label: '无人机/移动', emoji: '🚁' },
    components: { label: '核心零部件', emoji: '⚙️' },
    policy:     { label: '政策/投资', emoji: '📋' },
    research:   { label: '学术研究', emoji: '📄' }
};

const TYPE_CN = {
    product:  { label: '产品发布' },
    industry: { label: '行业动态' },
    research: { label: '论文研究' },
    opinion:  { label: '观点技巧' }
};

function renderCard(item) {
    const domain = DOMAIN_CN[item.domain] || { label: item.domain, emoji: '📌' };
    const type = TYPE_CN[item.type] || { label: item.type };
    const titleCn = item.titleCn || item.title;
    const summaryCn = item.summaryCn || item.summary;
    return `<article class="card fade-in" onclick="window.open('${item.link}', '_blank')">
        <div class="card-tags">
            <span class="tag tag-domain">${domain.emoji} ${domain.label}</span>
            <span class="tag tag-type">${type.label}</span>
        </div>
        <h3 class="card-title">${titleCn}</h3>
        <div class="card-title-en">${item.title}</div>
        <p class="card-summary">${summaryCn}</p>
        <div class="card-footer"><span>${item.source}</span><span>·</span><span>${item.date}</span></div>
    </article>`;
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('statTotal').textContent = data.total || 0;
        document.getElementById('statToday').textContent = data.today || 0;
        document.getElementById('statDomains').textContent = data.domainStats ? Object.keys(data.domainStats).length : 0;
        renderDomainBar(data.domainStats);
    } catch {}
}

function renderDomainBar(stats) {
    if (!stats) return;
    const bar = document.getElementById('domainBar');
    const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]).slice(0, 6);
    bar.innerHTML = sorted.map(([key, count]) => {
        const d = DOMAIN_CN[key] || { label: key, emoji: '📌' };
        return `<span class="domain-tag" onclick="window.location.href='all.html?domain=${key}'">${d.emoji} ${d.label} (${count})</span>`;
    }).join('');
}

async function loadFeed() {
    const list = document.getElementById('feedList');
    try {
        const res = await fetch('/api/feed?page=1&perPage=10');
        const data = await res.json();
        if (data.items && data.items.length > 0) {
            list.innerHTML = data.items.map(renderCard).join('');
        } else {
            list.innerHTML = '<div class="loading"><p>暂无数据，点击刷新抓取</p></div>';
        }
    } catch {
        list.innerHTML = '<div class="loading"><p>加载失败，请确认服务已启动</p></div>';
    }
}

async function refresh() {
    const btn = event.target;
    btn.textContent = '⏳ 抓取中...';
    btn.disabled = true;
    try {
        await fetch('/api/refresh');
        await new Promise(r => setTimeout(r, 3000));
        await loadFeed();
        await loadStats();
        btn.textContent = '✅ 已刷新';
        setTimeout(() => { btn.textContent = '🔄 刷新'; btn.disabled = false; }, 2000);
    } catch {
        btn.textContent = '❌ 失败';
        setTimeout(() => { btn.textContent = '🔄 刷新'; btn.disabled = false; }, 2000);
    }
}

loadStats();
loadFeed();
</script>
</body>
</html>
