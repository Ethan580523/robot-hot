<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业日报 · ROBOT HOT</title>
    <style>
        :root {
            --bg-primary: #0a0a0f; --bg-card: #1a1a24; --bg-card-hover: #22222e;
            --border: #2a2a38; --text-primary: #e8e8f0; --text-secondary: #9090a8; --text-muted: #606078;
            --accent: #00d4aa; --accent-dim: #00d4aa22;
            --radius: 12px; --radius-sm: 8px; --max-width: 960px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); line-height: 1.7; min-height: 100vh; }
        a { color: inherit; text-decoration: none; }
        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .nav-container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .nav-menu { display: flex; align-items: center; gap: 4px; list-style: none; }
        .nav-menu a { padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; }
        .nav-menu a:hover { color: var(--text-primary); background: var(--bg-card); }
        .nav-menu a.active { color: var(--accent); background: var(--accent-dim); }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 24px 20px 60px; }
        .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .page-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
        .daily-layout { display: grid; grid-template-columns: 180px 1fr; gap: 20px; }
        .daily-sidebar { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; position: sticky; top: 72px; max-height: calc(100vh - 80px); overflow-y: auto; }
        .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .date-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
        .date-list a { padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); transition: all 0.2s; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .date-list a:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .date-list a.active { background: var(--accent-dim); color: var(--accent); }
        .date-list a .count { font-size: 11px; background: var(--bg-primary); padding: 1px 6px; border-radius: 8px; color: var(--text-muted); }
        .daily-content { min-width: 0; }
        .daily-date-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section { margin-bottom: 24px; }
        .section-header { font-size: 15px; font-weight: 600; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .section-header .count { font-size: 12px; color: var(--text-muted); font-weight: 400; }
        .news-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 6px; transition: all 0.2s; cursor: pointer; }
        .news-item:hover { background: var(--bg-card-hover); }
        .news-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; line-height: 1.5; }
        .news-item .title-en { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .news-item p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-item .source { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .footer { border-top: 1px solid var(--border); padding: 24px 20px; text-align: center; font-size: 13px; color: var(--text-muted); }
        .mobile-tabs { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); z-index: 100; padding: 8px 0; }
        .mobile-tabs-inner { display: flex; justify-content: space-around; }
        .mobile-tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 16px; font-size: 11px; color: var(--text-muted); }
        .mobile-tabs a.active { color: var(--accent); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .nav-menu { display: none; } .mobile-tabs { display: block; } .container { padding-bottom: 80px; } .daily-layout { grid-template-columns: 1fr; } .daily-sidebar { position: static; max-height: none; margin-bottom: 14px; } .date-list { flex-direction: row; flex-wrap: wrap; } .date-list a { flex: 0 0 auto; } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><span>🤖</span><span>ROBOT HOT</span></a>
        <ul class="nav-menu">
            <li><a href="index.html">精选</a></li>
            <li><a href="all.html">全部动态</a></li>
            <li><a href="daily.html" class="active">日报</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>📰 行业日报</h1>
        <p class="subtitle">每日动态按领域归类</p>
    </div>
    <div class="daily-layout">
        <aside class="daily-sidebar">
            <div class="sidebar-title">📅 日期</div>
            <ul class="date-list" id="dateList"><li style="color:var(--text-muted);font-size:13px;padding:8px;">加载中...</li></ul>
        </aside>
        <div class="daily-content" id="dailyContent"><div class="loading">加载中...</div></div>
    </div>
</div>

<footer class="footer"><p>ROBOT HOT · 机器人产业动态聚合</p></footer>

<nav class="mobile-tabs">
    <div class="mobile-tabs-inner">
        <a href="index.html"><span>⭐</span>精选</a>
        <a href="all.html"><span>📋</span>全部</a>
        <a href="daily.html" class="active"><span>📰</span>日报</a>
        <a href="about.html"><span>ℹ️</span>更多</a>
    </div>
</nav>

<script>
async function loadDailyIndex() {
    try {
        const res = await fetch('/api/daily');
        const data = await res.json();
        const list = document.getElementById('dateList');
        if (!data.length) { list.innerHTML = '<li style="color:var(--text-muted);font-size:13px;">暂无日报</li>'; return; }
        list.innerHTML = data.map((d, i) =>
            `<li><a class="${i===0?'active':''}" onclick="loadDaily('${d.date}')"><span>${d.date}</span><span class="count">${d.count}</span></a></li>`
        ).join('');
        loadDaily(data[0].date);
    } catch {
        document.getElementById('dateList').innerHTML = '<li style="color:var(--text-muted);font-size:13px;">加载失败</li>';
    }
}

async function loadDaily(date) {
    document.querySelectorAll('.date-list a').forEach(a => {
        a.classList.toggle('active', a.textContent.includes(date));
    });
    const content = document.getElementById('dailyContent');
    content.innerHTML = '<div class="loading">加载中...</div>';
    try {
        const res = await fetch(`/api/daily/${date}`);
        const data = await res.json();
        if (data.error) { content.innerHTML = '<div class="loading">该日期暂无日报</div>'; return; }
        let html = `<div class="daily-date-header">📅 ${data.date} <span style="font-size:14px;color:var(--text-muted);font-weight:400;">(${data.totalItems}条)</span></div>`;
        if (data.sections && data.sections.length > 0) {
            for (const section of data.sections) {
                html += `<div class="section fade-in">
                    <div class="section-header"><span>${section.emoji} ${section.label}</span><span class="count">(${section.count})</span></div>
                    ${section.items.map(item => `
                        <div class="news-item" onclick="window.open('${item.link}', '_blank')">
                            <h4>${item.titleCn || item.title}</h4>
                            <div class="title-en">${item.title}</div>
                            <p>${item.summaryCn || item.summary}</p>
                            <div class="source">${item.source}</div>
                        </div>
                    `).join('')}
                </div>`;
            }
        } else {
            html += '<div class="loading">当天暂无动态</div>';
        }
        content.innerHTML = html;
    } catch {
        content.innerHTML = '<div class="loading">加载失败</div>';
    }
}

loadDailyIndex();
</script>
</body>
</html>
