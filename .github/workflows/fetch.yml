name: Fetch RSS Data
on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时抓取一次（UTC时间）
  workflow_dispatch: {}     # 也支持手动触发
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: echo "No dependencies needed - zero dependency project"
      - name: Run fetcher
        run: node fetcher.js
      - name: Commit and push
        run: |
          git config user.name "ROBOT-HOT-Bot"
          git config user.email "bot@robot-hot-actions"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Auto update data $(date -u '+%Y-%m-%d %H:%M')"
          git push
